  <body>
    <h1>
      等 靠 要
    </h1>
    <p>
      今天你，等靠要了吗？
    </p>
    <p>
      先说“等”。你要等着别人给你安排任务，自己不能有任何主观的想法，别人不说你就永远不能<br>
      行动。将决定权永远拱手让给别人，即使上刀山下火海，也要“等”着。
    </p>
    <p>
      接着是“靠”。俗话说：在家靠父母，在外靠朋友。归根结底是一个“靠”字，唯独不能靠自己。<br>
      没有别人的帮助，自己是做不成事的。
    </p>
    <p>
      最后是“要”。我不产生任何价值，但是我要丰厚的物质回报。我不想奋斗，但是我要成功。我不<br>
      xxx，但我要xxxx。
    </p>
    <p>
      所以，今天你“等靠要”了吗 ？
    </p>
